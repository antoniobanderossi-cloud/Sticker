version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sticker_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sticker_user
      POSTGRES_PASSWORD: sticker_password
      POSTGRES_DB: sticker_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sticker_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
